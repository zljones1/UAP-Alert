<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>UAP Alert</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#100800}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,0,0,.82);z-index:5}
#overlay.hidden{display:none}
.panel{width:min(640px,92vw);text-align:center;color:#e8d0a8;padding:24px}
.panel h1{font-size:clamp(32px,7vw,72px);color:#c00;letter-spacing:.12em;text-shadow:3px 3px 0 #300}
.panel .sub{color:#fc0;letter-spacing:.4em;font-size:12px;margin:6px 0 18px}
.panel p{color:#a89070;line-height:1.5;font-size:14px}
button.cta{margin-top:22px;background:#500;color:#fc8;border:3px solid #a40;padding:10px 28px;font-size:16px;cursor:pointer;font-family:inherit}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
@media(pointer:coarse){
#touch{display:block}
.joy,.firebtn,.weapbtn{pointer-events:auto;position:absolute;border:2px solid #ffffff44;background:#0006;color:#fff}
.joy{left:20px;bottom:56px;width:120px;height:120px;border-radius:50%}
.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff6;left:36px;top:36px}
.firebtn{right:20px;bottom:64px;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.weapbtn{right:120px;bottom:72px;width:52px;height:40px;display:flex;align-items:center;justify-content:center;font-size:12px}
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="view" width="320" height="200"></canvas>
<div id="touch">
<div class="joy" id="joy"><div class="knob" id="knob"></div></div>
<div class="weapbtn" id="weapbtn">GUN</div>
<div class="firebtn" id="firebtn">FIRE</div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
</div>
<script src="engine.js"></script>
</body>
</html>
